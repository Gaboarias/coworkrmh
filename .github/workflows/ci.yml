name: CI

# Gates de calidad en cada push y PR. Los tres son los mismos que corren en
# local con `npm run verify`.
#
# No corre `next build`: la build local hace OOM (ver LESSONS.md) y Vercel ya
# construye cada push. `tsc --noEmit` es el gate real de tipos.

on:
  push:
    branches: [main]
  pull_request:

# Un PR que recibe varios pushes seguidos cancela las corridas viejas.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Los tres pasos van con `if: always()` para ver TODOS los fallos de una
      # corrida, no sólo el primero. El job igual falla si alguno falla.
      - name: Type check
        if: always()
        run: npm run type-check

      - name: Lint
        if: always()
        run: npm run lint

      - name: Tests
        if: always()
        run: npm run test
